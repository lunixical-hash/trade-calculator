name: Scrape values and update site

# Automatically scrape MM2 values from Supreme Values, rebuild the calculator,
# and commit the results to main. GitHub Pages then serves the updated site,
# and archive-and-publish-site.yml snapshots the previous version.

on:
  schedule:
    # Every 6 hours (UTC). Adjust the cron as desired.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-values-main
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # pywebview isn't needed for scrape/build and pulls GTK deps on Linux;
          # install only what the scraper/builder require.
          python -m pip install "playwright>=1.49.0"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Scrape values
        run: python scrape_mm2_values.py

      - name: Rebuild calculator HTML
        run: python build_trade_calculator.py

      - name: Commit updated values and calculator
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mm2_values.json trade_calculator.html
          if git diff --staged --quiet; then
            echo "No value changes to commit."
            exit 0
          fi
          git commit -m "Auto-update MM2 values and calculator [scrape]"
          git push
